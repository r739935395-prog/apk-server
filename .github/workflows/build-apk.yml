name: Build DeviceVault APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build APK (Release)
        working-directory: DeviceVault
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease || gradle assembleRelease || ./gradlew assembleDebug || gradle assembleDebug
        env:
          ANDROID_HOME: $ANDROID_SDK_ROOT
          ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT

      - name: Build APK (Debug fallback)
        if: failure()
        working-directory: DeviceVault
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug || gradle assembleDebug
        env:
          ANDROID_HOME: $ANDROID_SDK_ROOT
          ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devicevault-release-apk
          path: DeviceVault/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devicevault-debug-apk
          path: DeviceVault/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeviceVault/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
