name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Install Android SDK (basic)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk android-sdk-platform-tools 2>/dev/null || true
          # If apt packages aren't available, rely on runner preinstalled SDK
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/lib/android-sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/lib/android-sdk}" >> $GITHUB_ENV
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Accept SDK licenses (manual)
        run: |
          export ANDROID_HOME=/usr/lib/android-sdk
          export ANDROID_SDK_ROOT=/usr/lib/android-sdk
          mkdir -p $ANDROID_HOME/licenses
          echo "d56f5187479451eabf01fb78af6dfcb131a648ae" > $ANDROID_HOME/licenses/android-sdk-license.txt || true
          echo "24333f8a63b6825ea9c5514f83c3b3e3f5a7e0b0" >> $ANDROID_HOME/licenses/android-sdk-license.txt || true
          # Create license files for build-tools and platforms
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-preview-license.txt || true
          # Force accept by copying if files exist elsewhere
          cp $ANDROID_HOME/licenses/*.txt $ANDROID_HOME/licenses/ 2>/dev/null || true
      - name: Build APK
        working-directory: Download/RafatAccountingApp_AndroidProject/RafatAccountingApp
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug || gradle assembleDebug || gradle assembleRelease
        env:
          ANDROID_HOME: /usr/lib/android-sdk
          ANDROID_SDK_ROOT: /usr/lib/android-sdk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-output
          path: '**/*.apk'
