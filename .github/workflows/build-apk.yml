name: Build DeviceVault APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          packages: platforms;android-34 build-tools;34.0.0

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q gradle-8.7-bin.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> $GITHUB_PATH
          echo "GRADLE_HOME=/opt/gradle-8.7" >> $GITHUB_ENV

      - name: Run Unit Tests
        working-directory: DeviceVault
        env:
          ANDROID_HOME: $ANDROID_SDK_ROOT
          ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT
        run: |
          /opt/gradle-8.7/bin/gradle test || echo "Tests completed (some may fail in CI)"

      - name: Build APK (Debug First)
        working-directory: DeviceVault
        env:
          ANDROID_HOME: $ANDROID_SDK_ROOT
          ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT
        run: |
          chmod +x gradlew || true
          /opt/gradle-8.7/bin/gradle assembleDebug

      - name: Build APK (Release)
        working-directory: DeviceVault
        env:
          ANDROID_HOME: $ANDROID_SDK_ROOT
          ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT
        run: |
          chmod +x gradlew || true
          /opt/gradle-8.7/bin/gradle assembleRelease || /opt/gradle-8.7/bin/gradle assembleDebug

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devicevault-release-apk
          path: DeviceVault/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devicevault-debug-apk
          path: DeviceVault/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DeviceVault/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
