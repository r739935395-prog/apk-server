name: Build & Verify WhatsApp Hub APK

on:
  push:
    branches:
      - 'arena/**'
      - 'main'
  workflow_dispatch:

jobs:
  build-whatsapphub:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: auto
      CGO_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Go >= 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.26.0'
          check-latest: true

      - name: Install Gradle 8.9 & Android SDK 35 + NDK r27
        run: |
          set -euxo pipefail
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q gradle-8.9-bin.zip -d /opt
          rm -f gradle-8.9-bin.zip
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Go Engine — Resolve Modules & Execute Unit + Race Tests
        working-directory: WhatsAppHub/whatsapp-engine
        run: |
          set -eo pipefail
          {
            echo "=== GO VERSION ==="
            go version
            echo "=== GO MOD TIDY ==="
            go mod tidy
            echo "=== GO UNIT & INTEGRATION TESTS ==="
            go test -v -race ./...
          } 2>&1 | tee /tmp/go-test.log

      - name: Go Engine — Cross-Compile ARM64 JNI Shared Library (libwhatshub_engine.so)
        working-directory: WhatsAppHub/whatsapp-engine
        run: |
          set -eo pipefail
          {
            NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
            OUT_DIR="../app/src/main/jniLibs/arm64-v8a"
            mkdir -p "$OUT_DIR"

            GOOS=android \
            GOARCH=arm64 \
            CGO_ENABLED=1 \
            CC="$NDK_BIN/aarch64-linux-android29-clang" \
            CXX="$NDK_BIN/aarch64-linux-android29-clang++" \
            CGO_CFLAGS="-O2 -DSQLITE_TEMP_STORE=3" \
            CGO_LDFLAGS="-Wl,-z,max-page-size=16384 -llog" \
            go build -trimpath -buildmode=c-shared \
              -ldflags="-s -w -extldflags=-Wl,-z,max-page-size=16384" \
              -o "$OUT_DIR/libwhatshub_engine.so" \
              ./cmd/libwhatshub

            rm -f "$OUT_DIR/libwhatshub_engine.h"
            ls -lh "$OUT_DIR/libwhatshub_engine.so"
            file "$OUT_DIR/libwhatshub_engine.so"
            readelf -Ws "$OUT_DIR/libwhatshub_engine.so" | grep "Java_com_rafat_whatshub_bridge_NativeBridge_" | grep -v "_cgoexp_"
          } 2>&1 | tee /tmp/go-ndk.log

      - name: Android App — Execute Kotlin & Robolectric Unit/Integration Tests
        working-directory: WhatsAppHub
        run: |
          set -eo pipefail
          gradle testReleaseUnitTest --stacktrace 2>&1 | tee /tmp/gradle-test.log

      - name: Android App — Generate Release Keystore, Build & Sign Release APK
        working-directory: WhatsAppHub
        run: |
          set -eo pipefail
          {
            KEYSTORE_FILE="/tmp/whatshub-release.jks"
            STORE_PASS="$(openssl rand -hex 20)"
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_FILE" \
              -alias whatshub \
              -keyalg RSA \
              -keysize 4096 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=WhatsApp Hub, OU=Mobile Engineering, O=Rafat, L=Ibb, C=YE"

            WHATSHUB_KEYSTORE_FILE="$KEYSTORE_FILE" \
            WHATSHUB_KEYSTORE_PASSWORD="$STORE_PASS" \
            WHATSHUB_KEY_ALIAS="whatshub" \
            WHATSHUB_KEY_PASSWORD="$STORE_PASS" \
            gradle assembleRelease --stacktrace

            cp app/build/outputs/apk/release/app-release.apk ./app-release.apk
            rm -f "$KEYSTORE_FILE"

            AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
            APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

            echo "=== APK FILE METRICS ==="
            ls -lh ./app-release.apk
            sha256sum ./app-release.apk

            echo "=== AAPT2 BADGING ==="
            "$AAPT2" dump badging ./app-release.apk | grep -E "^(package:|sdkVersion:|targetSdkVersion:|uses-permission:|application-label|launchable-activity:|native-code:)" || true

            echo "=== NATIVE LIBRARIES IN APK ==="
            unzip -l ./app-release.apk | grep -E "lib/.*\.so"

            echo "=== APKSIGNER VERIFICATION ==="
            "$APKSIGNER" verify --verbose --print-certs ./app-release.apk
          } 2>&1 | tee /tmp/apk-build.log

      - name: Upload Signed APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppHub-app-release-apk
          path: WhatsAppHub/app-release.apk

      - name: Commit Verified Artifacts or Diagnostic Log Back to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true

          if [ -f WhatsAppHub/app-release.apk ]; then
            {
              echo "WhatsApp Hub CI Build & Verification Report"
              echo "==========================================="
              cat /tmp/go-test.log || true
              echo ""
              cat /tmp/go-ndk.log || true
              echo ""
              tail -n 60 /tmp/gradle-test.log || true
              echo ""
              tail -n 80 /tmp/apk-build.log || true
            } > WhatsAppHub/docs/ci-verification-report.txt
            rm -f WhatsAppHub/docs/ci-failure-log.txt
            git add WhatsAppHub/whatsapp-engine/go.mod WhatsAppHub/whatsapp-engine/go.sum WhatsAppHub/docs/ci-verification-report.txt
            git add -f WhatsAppHub/app-release.apk
            git commit -m "chore(ci): attach verified signed WhatsAppHub/app-release.apk and test report [skip ci]" || exit 0
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            {
              echo "=== CI DIAGNOSTIC FAILURE LOG ==="
              tail -n 120 /tmp/go-test.log 2>/dev/null || true
              echo "--- NDK ---"
              tail -n 120 /tmp/go-ndk.log 2>/dev/null || true
              echo "--- GRADLE TEST ---"
              tail -n 160 /tmp/gradle-test.log 2>/dev/null || true
              echo "--- APK BUILD ---"
              tail -n 160 /tmp/apk-build.log 2>/dev/null || true
            } > WhatsAppHub/docs/ci-failure-log.txt
            git add WhatsAppHub/docs/ci-failure-log.txt WhatsAppHub/whatsapp-engine/go.sum 2>/dev/null || true
            git commit -m "chore(ci): record build diagnostic log [skip ci]" || exit 0
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
